# NekoSportsWorldTool 自动发布
#
# 触发方式：
#   ① 推送 tag：  git tag v0.2.0 && git push origin v0.2.0
#   ② 手动：     Actions 页面 Run workflow（可选 full/cli 模式，仅出构建产物，不发布）
#
# 注意：本文件需位于仓库根 .github/workflows/ 下
#（若仓库根就是 gui-rs 目录内容则无需调整；否则把 .github 移到仓库根）。
#
# Release 说明：workflow 已开启 generate_release_notes（按 commits 自动生成
# What's Changed），并附加固定的平台下载说明；如需自定义可在仓库根放

name: Release

on:
  push:
    branches: [feat/map-location-picker]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: 构建模式
        type: choice
        default: full
        options: [full, cli]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            mode: full
            artifact: NekoSportsWorldTool-win-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            mode: full
            artifact: NekoSportsWorldTool-macos-arm64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            mode: full
            artifact: NekoSportsWorldTool-linux-x64-gui
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            mode: cli
            artifact: NekoSportsWorldTool-linux-x64
            cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            mode: cli
            artifact: NekoSportsWorldTool-linux-aarch64
            cross: true
    runs-on: ${{ matrix.os }}
    env:
      MODE: ${{ github.event.inputs.mode || matrix.mode }}
      TARGET: ${{ matrix.target }}
      ARTIFACT: ${{ matrix.artifact }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux' && env.MODE == 'full'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libxrandr-dev libxcursor-dev libgl1-mesa-dev

      - name: Check native GUI APIs (macOS and Linux)
        if: env.MODE == 'full' && runner.os != 'Windows'
        run: cargo check --locked --target "$TARGET"
        shell: bash

      - name: GUI regression tests (Windows)
        if: matrix.os == 'windows-latest'
        run: cargo test --locked --lib

      - name: Route planner tests (Windows)
        if: matrix.os == 'windows-latest'
        run: cargo test --locked -p route-planner

      - name: Install cross (Linux 交叉编译)
        if: matrix.cross == true
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build (CLI-only)
        if: env.MODE == 'cli'
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --locked --release --target "$TARGET" --no-default-features
          else
            cargo build --locked --release --target "$TARGET" --no-default-features
          fi
        shell: bash

      - name: Build (full = GUI + CLI)
        if: env.MODE == 'full'
        run: cargo build --locked --release --target "$TARGET"
        shell: bash

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          BIN=target/$TARGET/release/nekosportsworldtool
          if [ "${{ matrix.os }}" = "windows-latest" ]; then BIN="$BIN.exe"; fi
          if [ "${{ matrix.os }}" = "macos-latest" ] && [ "$MODE" = "full" ]; then
            app="dist/NekoSportsWorldTool.app"
            mkdir -p "$app/Contents/MacOS"
            cp "$BIN" "$app/Contents/MacOS/nekosportsworldtool"
            cp macos/Info.plist "$app/Contents/Info.plist"
            version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $version" "$app/Contents/Info.plist"
            plutil -lint "$app/Contents/Info.plist"
            codesign --force --deep --sign - "$app"
            codesign --verify --deep --strict "$app"
            tar czf "dist/$ARTIFACT.tar.gz" -C dist NekoSportsWorldTool.app
            rm -rf "$app"
          elif [ "${{ matrix.os }}" = "ubuntu-latest" ] && [ "$MODE" = "full" ]; then
            mkdir -p dist/linux-gui
            cp "$BIN" linux/org.nekosportsworld.tool.desktop dist/linux-gui/
            tar czf "dist/$ARTIFACT.tar.gz" -C dist/linux-gui .
            rm -rf dist/linux-gui
          elif [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a "dist/$ARTIFACT.zip" "$BIN"
          else
            tar czf "dist/$ARTIFACT.tar.gz" -C "$(dirname "$BIN")" "$(basename "$BIN")"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  publish:
    name: Publish release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: NekoSportsWorldTool-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
