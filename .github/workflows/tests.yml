name: Windows Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: windows-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Full Cargo test suite
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run locked tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force diagnostics | Out-Null
          cargo test --all --locked *>&1 | Tee-Object diagnostics/cargo-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Preserve test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-cargo-test-diagnostics
          path: diagnostics/*
          if-no-files-found: ignore
