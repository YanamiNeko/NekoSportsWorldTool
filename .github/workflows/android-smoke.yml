name: Android Smoke

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 29.0.14206865
  BUILD_TOOLS: 36.0.0
  PLATFORM: android-36

jobs:
  smoke:
    name: Android startup and restart checks (API 36, x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-smoke-release

      - name: Install Android build components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "ndk;${NDK_VERSION}" "build-tools;${BUILD_TOOLS}" "platforms;${PLATFORM}" > /dev/null

      - name: Build an isolated smoke APK
        env:
          ABI: x86_64
          TARGET: x86_64-linux-android
          PACKAGE_DIR: ${{ runner.temp }}/neko-android-smoke
          KEYSTORE: ${{ runner.temp }}/neko-android-smoke.keystore
        run: |
          keytool -genkeypair -noprompt -keystore "$KEYSTORE" -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname 'CN=Neko CI Smoke,O=Testing,C=US'
          bash android/build-linux.sh

      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Check startup, Activity recreation, and process persistence
        uses: reactivecircus/android-emulator-runner@v2
        env:
          PACKAGE_DIR: ${{ runner.temp }}/neko-android-smoke
          KEYSTORE: ${{ runner.temp }}/neko-android-smoke.keystore
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash android/test-linux.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-startup-diagnostics
          path: ${{ runner.temp }}/neko-android-smoke/diagnostics/*
          if-no-files-found: ignore
