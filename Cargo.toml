[package]
name = "nekosportsworldtool"
version = "0.2.0"
edition = "2021"
description = "NekoSportsWorldTool：运动世界校园版协议自动化工具（GUI + CLI）"
license = "CC-BY-NC-4.0"
repository = "https://github.com/YanamiNeko/NekoSportsWorldTool"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:egui", "dep:egui_extras"]

[dependencies]
eframe = { version = "0.29", optional = true }
egui = { version = "0.29", optional = true }
egui_extras = { version = "0.29", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
ureq = { version = "2", default-features = false, features = ["json", "tls", "native-certs"] }
aes = "0.9"
cbc = { version = "0.2", features = ["alloc", "block-padding"] }
rsa = "0.9"
md-5 = "0.10"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
rand_distr = "0.4"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
incremental = false

[profile.dev]
debug = "line-tables-only"
